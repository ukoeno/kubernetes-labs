
apiVersion: v1
kind: Pod
metadata:
  name: configmap-env-demo
spec:
  restartPolicy: Never
  containers:
    - name: demo
      image: busybox:1.36
      command: ["sh", "-c"]
      args: ["echo APP_COLOR=$APP_COLOR; echo APP_ENV=$APP_ENV"]
      env:
        - name: APP_COLOR
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_COLOR
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_ENV

